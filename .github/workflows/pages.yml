name: Check History in Conversation

# GitHub Pages serves this repository from the `main` branch's `/docs` folder, so the
# committed `docs/` directory is the published site. This workflow does not deploy; it
# validates the data, runs the view checks, rebuilds, and fails if the committed `docs/`
# has drifted from the sources it is built from.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build recovers the archived 2000 baseline graph from the
          # commit whose dataset matches the hash pinned in scope.extension.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the curated graph
        run: python3 scripts/validate_graph.py
      - name: Install test dependencies
        run: python3 -m pip install duckdb==1.5.3 playwright==1.56.0
      - name: Data tests
        # test_journal_validation needs the gitignored raw catalogue inputs, so it runs locally only.
        run: python3 -m unittest tests.test_graph_validation tests.test_people_validation tests.test_evidence_asset tests.test_practice_families tests.test_student_beta tests.test_indigenous_deep_dive tests.test_indigenous_foundations tests.test_borderlands_release_candidate tests.test_evidence_coverage_audit tests.test_publication_repairs tests.test_open_frame tests.test_chronology tests.test_dissertation_site tests.test_canonical_work_gaps tests.test_gemini_expansion tests.test_dissertation_canon_audit tests.test_dissertation_content tests.test_historian_life_review tests.test_apply_person_entries_fields tests.test_historian_canon tests.test_historian_amendment tests.test_theorist_life_review tests.test_remaining_canon tests.test_response_edge_audit tests.test_historian_completion_1_200 tests.test_historian_resumed_1_205 tests.test_historian_resumed_1_206 tests.test_historian_resumed_1_207 tests.test_historian_resumed_1_208 tests.test_historian_resumed_1_209 tests.test_historian_resumed_1_210 tests.test_historian_resumed_1_211 tests.test_historian_resumed_1_212 tests.test_historian_resumed_1_213 tests.test_historian_resumed_1_214 tests.test_historian_resumed_1_215 tests.test_source_hosts
      - name: View tests
        run: node tests/test_site_core.mjs
      - name: Rebuild the allowlisted site into docs/
        run: python3 scripts/build_site.py
      - name: Install Chromium
        run: python3 -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: python3 tests/run_site_checks.py
      - name: Committed docs/ must match the sources
        run: |
          git status --porcelain docs
          git diff --exit-code --stat docs || { echo "::error::docs/ is stale. Run python3 scripts/build_site.py and commit docs/."; exit 1; }
